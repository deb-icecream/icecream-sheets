# Cloud Run service: engine-xl — STATEFUL engine, XL tier
# (design doc: 8 vCPU / 32 GiB for P95/P99-class workbooks — this is also
# the Cloud Run PLATFORM MAXIMUM per instance: 8 vCPU / 32 GiB, verified
# against cloud.google.com/run/quotas on 2026-10-20; nothing larger exists
# to scale into, which is worth knowing before promising bigger tiers).
# Same image, same posture, same concurrency reasoning as
# engine-standard.yaml — only sizing, heap and maxScale differ.
# Production load path (user ruling 2026-10-21, W22): same as
# engine-standard — loads arrive by GCS reference; the engine pulls the
# uploaded object from UPLOAD_BUCKET via its service account (see
# engine-standard.yaml header + deploy/CONFIG.md load-path section).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: icecream-sheet-engine-xl
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"     # scale-to-zero, doc mandate
        autoscaling.knative.dev/maxScale: "10"    # fewer, bigger instances; cost guardrail
        run.googleapis.com/cpu-throttling: "false"  # CPU always allocated
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${ENGINE_SA}
      timeoutSeconds: 3600        # Cloud Run maximum (doc-mandated)
      containerConcurrency: 80    # one session holds many concurrent connections (see engine-standard.yaml)
      containers:
        - image: ${IMAGE_ENGINE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"              # FIRST-DEPLOY placeholder size (user ruling 2026-10-21: free-tier-first; design size 8 vCPU / 32 Gi — raise when XL is actually funded)
              memory: 4Gi
          env:
            - name: HOST
              value: "0.0.0.0"      # W17b: bin reads HOST (default 127.0.0.1 local); Cloud Run probes require 0.0.0.0:$PORT
            - name: ENGINE_HEAP_MB
              value: "3072"         # 75% of 4 GiB (first-deploy size; design 24576 = 75% of 32 GiB)
            - name: ENGINE_TIER
              value: xl
            - name: ENGINE_INSTANCE_ID
              value: "engine-xl-1"   # PLACEMENT (owner 2026-10-23): this service's identity in the gateway's ENGINE_INSTANCES fleet map — MUST equal the map key, or the ownership heartbeat fences this instance's own sessions
            - name: ICECREAM_DATA_DIR
              value: /tmp/icecream-data
            - name: ICECREAM_MT_CELL_COUNT_THRESHOLD
              value: ${MT_CELL_COUNT_THRESHOLD}
            - name: UPLOAD_BUCKET
              value: ${BUCKET_UPLOADS}   # W22: production load path — engine pulls the opened object from this bucket via its SA (code follow-on)
            - name: UPLOAD_STORE
              value: "prod"          # W22 prod posture: /load/storage-ref reads the opened object from UPLOAD_BUCKET via the GCS client (bin/engine.ts; fails closed without it)
            - name: TRIGGER_STORE
              value: "prod"   # triggers program: the engine-hosted trigger supervisor's Firestore write-through store (collection icecream_trigger_metadata; fail-closed when the project/client is missing)
            - name: SESSION_STORE
              value: "prod"   # OWNER RULING 2026-10-23: ALWAYS ON for hosted — session registry/journal in Firestore + snapshots in GCS (deploy/sessionStore.ts prodSessionConfig). Hosted posture REQUIRES this store; it is not optional. Fail-closed when half-configured (needs GCP_PROJECT_ID + SESSION_SNAPSHOT_BUCKET).
            - name: SESSION_LIFECYCLE
              value: "on"   # BATCH-2 WEDGE FIX: enable the idle sweeper (engineSvc) so an orphaned/stranded session is checkpointed + evicted after IDLE_TIMEOUT_MS (default 600000 = the 10-minute idle rule, design section 9 / engineAccess.sessionLifecycleEnabled). Without this the sweeper never runs in prod and a stranded session wedges its instance forever.
            - name: SESSION_SNAPSHOT_BUCKET
              value: ${BUCKET_SNAPSHOTS}   # GCS bucket for session snapshots (FirestoreSessionStores.snapshots)
            - name: GCP_PROJECT_ID
              value: ${GCP_PROJECT}       # W22: project for the engine's GCS clients (upload pull; sessionStore prod config reads the same var)
            - name: ENGINE_ACCESS_MODE
              value: signed            # F-2 (security pass): engine self-verifies gateway-issued signed tokens on every route; proxy mode (raw x-principal identity) must never be the deployed posture
            - name: ENGINE_ACCESS_SECRET   # HMAC secret the signed tokens are verified with (deploy/engineAccess.ts); Secret Manager, never plaintext
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_ENGINE_SIGNING}
                  key: latest
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
